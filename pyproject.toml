[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livekit-plugins-azure-speech-translate"
version = "1.0.0"
description = "LiveKit Agents plugin for Azure AI Speech (Live Interpreter) realtime translation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"

authors = [
    { name = "Swayam Hingu" }
]

keywords = [
    "livekit",
    "azure",
    "cognitive-services",
    "speech",
    "translation",
    "realtime",
    "voice",
    "audio"
]

classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
    "livekit-agents>=1.6.4",
    "livekit-plugins-silero>=1.6.4",
    "azure-cognitiveservices-speech==1.50.0",
]

[project.urls]
Repository = "https://github.com/Swayam-Hingu-PE/livekit-azure-speech-translate-plugin"

[tool.hatch.build.targets.wheel]
packages = ["livekit"]

[tool.hatch.build.targets.sdist]
include = ["/livekit"]
